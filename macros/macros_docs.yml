macros:
  - name: cents_to_dollars
    arguments:
      - name: column_name
        type: string
      - name: decimals
        type: integer
  - name: grant_select
    description: A macro that grants select privs on target.schema to target.role unless otherwise specified
    arguments:
      - name: schema
        type: string
        description: Schema we want to grant privs on, by default is our target schema 
      - name: role
        type: string
        description: Role we want to grant privs on, by default is our target.role
        